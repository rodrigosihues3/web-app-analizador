{% extends "base.html" %}

{% block content %}
<div class="pila">
    <section class="tarjeta" aria-labelledby="titulo-cargar">
        <div class="tarjeta-cuerpo">
            <h2 id="titulo-cargar" class="titulo-seccion" >Cargar datos</h2>

            <div class="rejilla-2">
                <form
                    hx-post="/analizar/cargar"
                    hx-target="#workspace"
                    hx-encoding="multipart/form-data"
                    hx-indicator="#indicador-carga-inicial"
                    class="formulario-carga"
                   
                >
                    <div>
                        <label for="input-archivo" class="campo-etiqueta">Subir un archivo</label>
                        <p class="campo-ayuda">Formatos CSV o Excel.</p>
                        <input
                            id="input-archivo"
                            name="archivo"
                            type="file"
                            accept=".csv,.xlsx"
                            class="control"
                        >
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primario btn-carga btn-bloque-movil">
                            Analizar archivo
                        </button>
                    </div>
                </form>

                <form
                    hx-post="/analizar/cargar"
                    hx-target="#workspace"
                    hx-indicator="#indicador-carga-inicial"
                    class="formulario-carga"
                   
                >
                    <div>
                        <label for="select-dataset-demo" class="campo-etiqueta">Usar un ejemplo</label>
                        <p class="campo-ayuda">Prueba con datos de muestra.</p>
                        <select
                            id="select-dataset-demo"
                            name="dataset_demo"
                            class="control"
                        >
                            {% for demo in datasets_demo %}
                            <option value="{{ demo.archivo }}">{{ demo.etiqueta }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-carga btn-bloque-movil">
                            Analizar ejemplo
                        </button>
                    </div>
                </form>
            </div>

            <div id="indicador-carga-inicial" class="htmx-indicator indicador" role="status" aria-live="polite">
                <span class="spinner" aria-hidden="true"></span>
                <span>Analizando…</span>
            </div>
        </div>
    </section>

    <div id="workspace" class="pila">
        <div class="tarjeta-vacia">
            <p>Sube un archivo o elige un ejemplo para comenzar.</p>
        </div>
    </div>
</div>
{% endblock %}
