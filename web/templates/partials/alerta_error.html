<div class="bg-red-50 border border-red-400 rounded-sm p-4 shadow-sm" role="alert">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-red-200 pb-2 mb-2">
        <div class="flex items-center space-x-2">
            <span class="px-2 py-0.5 text-xs font-mono font-bold uppercase bg-red-800 text-white rounded-sm">
                ALERTA CONTROLADA
            </span>
            <h3 class="text-xs font-bold uppercase tracking-wider text-red-900">
                {{ titulo_error | default("EXCEPCIÓN OPERATIVA EN EL PROCESAMIENTO") }}
            </h3>
        </div>
        <span class="text-xs font-mono text-red-700 mt-1 sm:mt-0">
            ESTADO: OPERACIÓN DETENIDA
        </span>
    </div>
    <p class="text-xs font-mono text-red-900 leading-relaxed">
        {{ mensaje_error }}
    </p>
</div>
