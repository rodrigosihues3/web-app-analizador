<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Analizador de Datos{% endblock %}</title>
    <script>
        (function () {
            var tema = "light";
            try {
                var guardado = window.localStorage.getItem("tema-analizador");
                if (guardado === "dark" || guardado === "light") {
                    tema = guardado;
                }
            } catch (err) {
                /* Sin acceso al almacenamiento: se usa el tema claro. */
            }
            document.documentElement.setAttribute("data-theme", tema);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/plotly.min.js"></script>
    <script src="/static/js/htmx.min.js"></script>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <header class="encabezado">
        <div class="contenedor encabezado-interior">
            <h1 class="titulo-app">Analizador de Datos</h1>
            <button type="button" id="boton-tema" class="btn btn-icono" aria-label="Cambiar a tema oscuro" title="Cambiar a tema oscuro">
                <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
                </svg>
                <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="principal contenedor">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/theme.js"></script>
    <script>
        document.body.addEventListener("htmx:beforeSwap", function (evt) {
            if (evt.detail.xhr && evt.detail.xhr.status === 400) {
                evt.detail.shouldSwap = true;
                evt.detail.isError = false;
            }
        });

        document.body.addEventListener("htmx:afterSettle", function (evt) {
            if (window.Plotly) {
                var graficos = evt.detail.elt.querySelectorAll(".plotly-graph-div");
                graficos.forEach(function (div) {
                    try {
                        window.Plotly.Plots.resize(div);
                    } catch (err) {
                        /* Ajuste silencioso */
                    }
                });
                if (window.AnalizadorTema) {
                    window.AnalizadorTema.aplicarGraficos(evt.detail.elt);
                }
            }
        });
    </script>
</body>
</html>
