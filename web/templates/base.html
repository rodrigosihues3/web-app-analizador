{% from "macros/icons.html" import lucide_icon %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Analizador de Datos{% endblock %}</title>
    <link rel="icon" href="/favicon.ico">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("analizador_theme");
                var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                var theme = saved || (prefersDark ? "dark" : "light");
                if (theme === "dark") {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/plotly.min.js"></script>
    <script src="/static/js/htmx.min.js"></script>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <!-- Barra superior fija compacta -->
    <header class="navbar-sticky">
        <div class="max-w-6xl mx-auto h-full px-4 sm:px-6 flex items-center justify-between gap-4">
            <button
                type="button"
                id="btn-marca-inicio"
                hx-post="/analizar/restaurar"
                hx-include="#session-actual"
                hx-target="#workspace"
                hx-swap="innerHTML"
                class="brand-wordmark bg-transparent border-0 p-0 cursor-pointer text-left"
                title="Volver al inicio"
            >
                Analizador de Datos
            </button>

            <div class="flex items-center gap-2">
                <input type="hidden" id="session-actual" name="session_id" value="">

                <button
                    id="btn-abrir-modal-carga"
                    type="button"
                    onclick="window.openUploadModal()"
                    class="hidden btn-primary px-3.5 py-1.5 text-xs"
                >
                    {{ lucide_icon("upload", "w-3.5 h-3.5") }}
                    <span>Analizar nuevo archivo</span>
                </button>

                <button
                    type="button"
                    id="btn-cambiar-tema"
                    onclick="window.toggleTheme()"
                    class="btn-secondary p-2"
                    aria-label="Cambiar tema claro u oscuro"
                    title="Cambiar tema"
                >
                    <span class="icon-sun">{{ lucide_icon("sun", "w-4 h-4") }}</span>
                    <span class="icon-moon">{{ lucide_icon("moon", "w-4 h-4") }}</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Área principal -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Modal de carga (disponible cuando ya existe un análisis activo) -->
    <div
        id="modal-carga"
        class="modal-backdrop"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-carga-titulo"
        aria-hidden="true"
    >
        <div class="modal-panel p-6 space-y-5">
            <div class="flex items-center justify-between">
                <div>
                    <h2 id="modal-carga-titulo" class="text-base font-semibold text-primary heading-tight">
                        Analizar nuevo archivo
                    </h2>
                    <p class="text-xs text-secondary mt-0.5">
                        El archivo original permanece intacto durante todo el análisis.
                    </p>
                </div>
                <button
                    type="button"
                    onclick="window.closeUploadModal()"
                    class="btn-ghost p-1.5"
                    aria-label="Cerrar modal"
                >
                    {{ lucide_icon("x", "w-4 h-4") }}
                </button>
            </div>

            <form
                id="form-carga-modal"
                hx-post="/analizar/cargar"
                hx-target="#workspace"
                hx-encoding="multipart/form-data"
                hx-sync="this:drop"
                hx-disabled-elt="find button[type='submit']"
                class="space-y-4"
            >
                <label
                    id="modal-dropzone"
                    for="input-archivo-modal"
                    class="dropzone-area block p-8 text-center cursor-pointer"
                >
                    <div id="modal-estado-vacio" class="flex flex-col items-center gap-2.5">
                        <span class="p-2.5 rounded-full surface-card text-accent">
                            {{ lucide_icon("upload", "w-5 h-5") }}
                        </span>
                        <div class="text-sm font-medium text-primary">
                            Arrastra tu archivo aquí o haz clic para seleccionarlo
                        </div>
                        <div class="text-xs text-muted">
                            Solo archivos tabulares .csv o .xlsx
                        </div>
                    </div>

                    <div id="modal-estado-verificando" class="hidden flex-col items-center gap-2">
                        <span class="p-2.5 rounded-full surface-card text-accent">
                            <span class="icon-spin inline-flex">{{ lucide_icon("refresh-cw", "w-5 h-5") }}</span>
                        </span>
                        <div class="text-sm font-medium text-primary">Verificando archivo...</div>
                        <div id="modal-nombre-verificando" class="text-xs font-mono text-muted"></div>
                    </div>

                    <div id="modal-estado-archivo" class="hidden flex-col items-center gap-2">
                        <span class="p-2.5 rounded-full surface-card text-accent">
                            {{ lucide_icon("file-spreadsheet", "w-5 h-5") }}
                        </span>
                        <div id="modal-archivo-nombre" class="text-sm font-semibold text-primary break-all"></div>
                        <div id="modal-archivo-meta" class="text-xs font-mono text-accent tabular-nums"></div>
                        <div class="text-xs text-muted mt-0.5">
                            Haz clic o arrastra otro archivo para cambiarlo
                        </div>
                    </div>

                    <input
                        id="input-archivo-modal"
                        name="archivo"
                        type="file"
                        accept=".csv,.xlsx"
                        class="sr-only"
                    >
                </label>

                <div class="min-h-[1.25rem] text-center">
                    <p id="modal-estado-valido" class="hidden status-fade text-xs font-medium text-valid-inline">
                        Archivo válido
                    </p>
                    <p id="modal-error-archivo" class="hidden text-xs font-medium text-error-inline"></p>
                </div>

                <div class="flex items-center justify-end gap-2">
                    <button
                        type="button"
                        onclick="window.closeUploadModal()"
                        class="btn-secondary px-3.5 py-1.5 text-sm"
                    >
                        Cancelar
                    </button>
                    <button
                        id="btn-analizar-modal"
                        type="submit"
                        disabled
                        class="btn-primary px-4 py-1.5 text-sm"
                    >
                        <span class="hide-on-request inline-flex items-center gap-1.5">
                            {{ lucide_icon("file-search", "w-4 h-4") }}
                            <span>Analizar este archivo</span>
                        </span>
                        <span class="htmx-indicator items-center gap-1.5">
                            <span class="icon-spin inline-flex">{{ lucide_icon("refresh-cw", "w-3.5 h-3.5") }}</span>
                            <span>Analizando...</span>
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function () {
            var modal = document.getElementById("modal-carga");
            var modalDropzone = document.getElementById("modal-dropzone");
            var modalInput = document.getElementById("input-archivo-modal");
            var modalFileNameEl = document.getElementById("modal-archivo-nombre");
            var modalErrorEl = document.getElementById("modal-error-archivo");
            var modalSubmitBtn = document.getElementById("btn-analizar-modal");
            var modalForm = document.getElementById("form-carga-modal");
            var dragDepth = 0;

            function isDarkTheme() {
                return document.documentElement.getAttribute("data-theme") === "dark";
            }

            function hasActiveSession() {
                var sessEl = document.getElementById("session-actual");
                return Boolean(sessEl && sessEl.value && sessEl.value.trim() !== "");
            }

            window.updatePlotlyTheme = function (container) {
                if (!window.Plotly) return;
                var scope = container || document;
                var dark = isDarkTheme();
                var textColor = dark ? "#fafafa" : "#18181b";
                var mutedColor = dark ? "#a1a1aa" : "#52525b";
                var gridColor = dark ? "#27272a" : "#e7e5e4";

                var divs = scope.querySelectorAll(".plotly-graph-div");
                divs.forEach(function (div) {
                    try {
                        window.Plotly.relayout(div, {
                            "font.color": textColor,
                            "title.font.color": textColor,
                            "xaxis.gridcolor": gridColor,
                            "xaxis.linecolor": gridColor,
                            "xaxis.zerolinecolor": gridColor,
                            "xaxis.tickfont.color": mutedColor,
                            "xaxis.title.font.color": mutedColor,
                            "yaxis.gridcolor": gridColor,
                            "yaxis.linecolor": gridColor,
                            "yaxis.zerolinecolor": gridColor,
                            "yaxis.tickfont.color": mutedColor,
                            "yaxis.title.font.color": mutedColor
                        });
                        window.Plotly.Plots.resize(div);
                    } catch (err) {}
                });
            };

            window.toggleTheme = function () {
                var nextTheme = isDarkTheme() ? "light" : "dark";
                if (nextTheme === "dark") {
                    document.documentElement.setAttribute("data-theme", "dark");
                } else {
                    document.documentElement.removeAttribute("data-theme");
                }
                try {
                    localStorage.setItem("analizador_theme", nextTheme);
                } catch (e) {}
                window.updatePlotlyTheme(document);
            };

            window.openUploadModal = function () {
                if (!modal) return;
                if (modalErrorEl) {
                    modalErrorEl.classList.add("hidden");
                    modalErrorEl.textContent = "";
                }
                modal.classList.add("is-open");
                modal.setAttribute("aria-hidden", "false");
            };

            window.closeUploadModal = function () {
                if (!modal) return;
                modal.classList.remove("is-open");
                modal.setAttribute("aria-hidden", "true");
                if (modalDropzone) modalDropzone.classList.remove("is-dragover");
                dragDepth = 0;
            };

            window.toggleAccordion = function (cardId) {
                var card = document.getElementById(cardId);
                if (!card) return;
                var collapsed = card.classList.toggle("is-collapsed");
                var trigger = card.querySelector("[data-accordion-trigger]");
                if (trigger) {
                    trigger.setAttribute("aria-expanded", String(!collapsed));
                }
            };

            window.collapseAuditAccordions = function () {
                ["acordeon-calidad", "acordeon-configuracion"].forEach(function (id) {
                    var card = document.getElementById(id);
                    if (card && !card.classList.contains("is-collapsed")) {
                        card.classList.add("is-collapsed");
                        var trigger = card.querySelector("[data-accordion-trigger]");
                        if (trigger) trigger.setAttribute("aria-expanded", "false");
                    }
                });
            };

            window.runTypewriter = function (scope) {
                var root = scope || document;
                var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                var targets = root.querySelectorAll('[data-typewriter="true"]');
                targets.forEach(function (el) {
                    if (el.dataset.typed === "done") return;
                    var fullText = el.textContent || "";
                    el.dataset.typed = "done";
                    if (reduceMotion || fullText.length === 0) return;

                    el.textContent = "";
                    var idx = 0;
                    var step = Math.max(1, Math.ceil(fullText.length / 65));
                    function tick() {
                        idx = Math.min(fullText.length, idx + step);
                        el.textContent = fullText.slice(0, idx);
                        if (idx < fullText.length) {
                            window.requestAnimationFrame(tick);
                        }
                    }
                    window.requestAnimationFrame(tick);
                });
            };

            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + " B";
                var kb = bytes / 1024;
                if (kb < 1024) return kb.toFixed(1) + " KB";
                return (kb / 1024).toFixed(2) + " MB";
            }

            function inspectFileContent(file) {
                return new Promise(function (resolve) {
                    var lower = file.name.toLowerCase();
                    if (!lower.endsWith(".csv") && !lower.endsWith(".xlsx")) {
                        resolve({ ok: false, error: "Formato no compatible. Selecciona un archivo .csv o .xlsx." });
                        return;
                    }
                    if (file.size === 0) {
                        resolve({ ok: false, error: "El archivo está vacío (0 KB). Selecciona un archivo con datos." });
                        return;
                    }

                    var slice = file.slice(0, 4096);
                    slice.arrayBuffer().then(function (buf) {
                        var bytes = new Uint8Array(buf);
                        if (lower.endsWith(".xlsx")) {
                            var isZip = bytes.length >= 4 &&
                                bytes[0] === 0x50 && bytes[1] === 0x4b &&
                                bytes[2] === 0x03 && bytes[3] === 0x04;
                            if (!isZip) {
                                resolve({ ok: false, error: "El contenido no corresponde a un archivo Excel (.xlsx) válido." });
                                return;
                            }
                            resolve({ ok: true, ext: "XLSX" });
                            return;
                        }

                        var isBinarySig =
                            (bytes.length >= 4 && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47) ||
                            (bytes.length >= 3 && bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) ||
                            (bytes.length >= 4 && bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46) ||
                            (bytes.length >= 4 && bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x38) ||
                            (bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4b && bytes[2] === 0x03 && bytes[3] === 0x04);
                        if (isBinarySig) {
                            resolve({ ok: false, error: "El archivo parece binario o de imagen, no un CSV de texto." });
                            return;
                        }

                        var hasNullByte = false;
                        var hasNonWhitespace = false;
                        for (var i = 0; i < bytes.length; i++) {
                            if (bytes[i] === 0) {
                                hasNullByte = true;
                                break;
                            }
                            if (bytes[i] !== 32 && bytes[i] !== 9 && bytes[i] !== 10 && bytes[i] !== 13) {
                                hasNonWhitespace = true;
                            }
                        }
                        if (hasNullByte) {
                            resolve({ ok: false, error: "El archivo contiene datos binarios incompatibles con CSV." });
                            return;
                        }
                        if (!hasNonWhitespace) {
                            resolve({ ok: false, error: "El archivo CSV no contiene registros legibles." });
                            return;
                        }
                        resolve({ ok: true, ext: "CSV" });
                    }).catch(function () {
                        resolve({ ok: false, error: "No se pudo leer el contenido del archivo." });
                    });
                });
            }

            function getUploadRefs(prefix) {
                return {
                    dropzone: document.getElementById(prefix + "-dropzone"),
                    input: document.getElementById("input-archivo-" + prefix),
                    emptyState: document.getElementById(prefix + "-estado-vacio"),
                    verifyingState: document.getElementById(prefix + "-estado-verificando"),
                    verifyingName: document.getElementById(prefix + "-nombre-verificando"),
                    fileState: document.getElementById(prefix + "-estado-archivo"),
                    fileNameEl: document.getElementById(prefix + "-archivo-nombre"),
                    fileMetaEl: document.getElementById(prefix + "-archivo-meta"),
                    validMsgEl: document.getElementById(prefix + "-estado-valido"),
                    errorEl: document.getElementById(prefix + "-error-archivo"),
                    submitBtn: document.getElementById("btn-analizar-" + prefix)
                };
            }

            function setFlexState(el, visible) {
                if (!el) return;
                if (visible) {
                    el.classList.remove("hidden");
                    el.classList.add("flex");
                } else {
                    el.classList.add("hidden");
                    el.classList.remove("flex");
                }
            }

            var validMessageTimers = {};

            function resetUploadVisual(prefix) {
                var r = getUploadRefs(prefix);
                if (validMessageTimers[prefix]) {
                    clearTimeout(validMessageTimers[prefix]);
                    delete validMessageTimers[prefix];
                }
                if (r.dropzone) r.dropzone.classList.remove("has-file");
                setFlexState(r.emptyState, true);
                setFlexState(r.verifyingState, false);
                setFlexState(r.fileState, false);
                if (r.validMsgEl) {
                    r.validMsgEl.classList.remove("is-visible");
                    r.validMsgEl.classList.add("hidden");
                }
                if (r.errorEl) {
                    r.errorEl.classList.add("hidden");
                    r.errorEl.textContent = "";
                }
                if (r.submitBtn) r.submitBtn.disabled = true;
            }

            function validateAndPreview(file, prefix) {
                if (!file) return;
                var r = getUploadRefs(prefix);
                if (validMessageTimers[prefix]) {
                    clearTimeout(validMessageTimers[prefix]);
                    delete validMessageTimers[prefix];
                }

                if (r.dropzone) r.dropzone.classList.remove("has-file");
                setFlexState(r.emptyState, false);
                setFlexState(r.fileState, false);
                setFlexState(r.verifyingState, true);
                if (r.verifyingName) r.verifyingName.textContent = file.name;
                if (r.errorEl) {
                    r.errorEl.classList.add("hidden");
                    r.errorEl.textContent = "";
                }
                if (r.validMsgEl) {
                    r.validMsgEl.classList.remove("is-visible");
                    r.validMsgEl.classList.add("hidden");
                }
                if (r.submitBtn) r.submitBtn.disabled = true;

                var start = Date.now();
                inspectFileContent(file).then(function (res) {
                    var elapsed = Date.now() - start;
                    var delay = Math.max(0, 420 - elapsed);
                    setTimeout(function () {
                        setFlexState(r.verifyingState, false);
                        if (!res.ok) {
                            if (r.input) r.input.value = "";
                            setFlexState(r.emptyState, true);
                            if (r.errorEl) {
                                r.errorEl.textContent = res.error;
                                r.errorEl.classList.remove("hidden");
                            }
                            if (r.submitBtn) r.submitBtn.disabled = true;
                            return;
                        }

                        if (r.dropzone) r.dropzone.classList.add("has-file");
                        if (r.fileNameEl) r.fileNameEl.textContent = file.name;
                        if (r.fileMetaEl) {
                            r.fileMetaEl.textContent = formatFileSize(file.size) + " · " + res.ext;
                        }
                        setFlexState(r.fileState, true);
                        if (r.submitBtn) r.submitBtn.disabled = false;

                        if (r.validMsgEl) {
                            r.validMsgEl.classList.remove("hidden");
                            window.requestAnimationFrame(function () {
                                r.validMsgEl.classList.add("is-visible");
                            });
                            validMessageTimers[prefix] = setTimeout(function () {
                                r.validMsgEl.classList.remove("is-visible");
                                setTimeout(function () {
                                    if (!r.validMsgEl.classList.contains("is-visible")) {
                                        r.validMsgEl.classList.add("hidden");
                                    }
                                }, 260);
                            }, 4500);
                        }
                    }, delay);
                });
            }

            function bindInitialDropzone() {
                var inicioInput = document.getElementById("input-archivo-inicio");
                if (inicioInput && !inicioInput.dataset.bound) {
                    inicioInput.dataset.bound = "true";
                    inicioInput.addEventListener("change", function () {
                        if (inicioInput.files && inicioInput.files.length > 0) {
                            validateAndPreview(inicioInput.files[0], "inicio");
                        }
                    });
                }
            }

            if (modalInput) {
                modalInput.addEventListener("change", function () {
                    if (modalInput.files && modalInput.files.length > 0) {
                        validateAndPreview(modalInput.files[0], "modal");
                    }
                });
            }

            if (modal) {
                modal.addEventListener("click", function (evt) {
                    if (evt.target === modal) {
                        window.closeUploadModal();
                    }
                });
            }

            document.addEventListener("keydown", function (evt) {
                if (evt.key === "Escape") {
                    window.closeUploadModal();
                    document.querySelectorAll(".tooltip-wrapper.is-open").forEach(function (w) {
                        w.classList.remove("is-open");
                    });
                }
            });

            /* Arrastrar archivo sobre cualquier punto de la ventana */
            function hasFiles(evt) {
                return evt.dataTransfer && Array.prototype.indexOf.call(evt.dataTransfer.types || [], "Files") !== -1;
            }

            window.addEventListener("dragenter", function (evt) {
                if (!hasFiles(evt)) return;
                evt.preventDefault();
                dragDepth += 1;
                if (hasActiveSession()) {
                    window.openUploadModal();
                    if (modalDropzone) modalDropzone.classList.add("is-dragover");
                } else {
                    var inicioDrop = document.getElementById("inicio-dropzone");
                    if (inicioDrop) inicioDrop.classList.add("is-dragover");
                }
            });

            window.addEventListener("dragover", function (evt) {
                if (!hasFiles(evt)) return;
                evt.preventDefault();
                if (evt.dataTransfer) evt.dataTransfer.dropEffect = "copy";
                if (hasActiveSession()) {
                    if (modalDropzone) modalDropzone.classList.add("is-dragover");
                } else {
                    var inicioDrop = document.getElementById("inicio-dropzone");
                    if (inicioDrop) inicioDrop.classList.add("is-dragover");
                }
            });

            window.addEventListener("dragleave", function (evt) {
                if (!hasFiles(evt)) return;
                dragDepth = Math.max(0, dragDepth - 1);
                if (dragDepth === 0) {
                    if (modalDropzone) modalDropzone.classList.remove("is-dragover");
                    var inicioDrop = document.getElementById("inicio-dropzone");
                    if (inicioDrop) inicioDrop.classList.remove("is-dragover");
                }
            });

            window.addEventListener("drop", function (evt) {
                if (!hasFiles(evt)) return;
                evt.preventDefault();
                dragDepth = 0;
                if (modalDropzone) modalDropzone.classList.remove("is-dragover");
                var inicioDrop = document.getElementById("inicio-dropzone");
                if (inicioDrop) inicioDrop.classList.remove("is-dragover");

                var files = evt.dataTransfer.files;
                if (!files || files.length === 0) return;

                if (hasActiveSession() && modalInput) {
                    try {
                        var dtModal = new DataTransfer();
                        dtModal.items.add(files[0]);
                        modalInput.files = dtModal.files;
                    } catch (err) {}
                    window.openUploadModal();
                    validateAndPreview(files[0], "modal");
                } else {
                    var inicioInput = document.getElementById("input-archivo-inicio");
                    if (inicioInput) {
                        try {
                            var dtInicio = new DataTransfer();
                            dtInicio.items.add(files[0]);
                            inicioInput.files = dtInicio.files;
                        } catch (err) {}
                        validateAndPreview(files[0], "inicio");
                    }
                }
            });

            /* Posicionamiento inteligente de tooltips ? para evitar recortes en bordes */
            function adjustTooltipPosition(wrapper) {
                var popover = wrapper.querySelector(".tooltip-popover");
                if (!popover) return;
                popover.classList.remove("align-left", "align-right", "place-bottom");
                var rect = popover.getBoundingClientRect();
                if (rect.right > window.innerWidth - 12) {
                    popover.classList.add("align-right");
                } else if (rect.left < 12) {
                    popover.classList.add("align-left");
                }
                if (rect.top < 64) {
                    popover.classList.add("place-bottom");
                }
            }

            document.addEventListener("mouseenter", function (evt) {
                var wrapper = evt.target && evt.target.closest ? evt.target.closest(".tooltip-wrapper") : null;
                if (wrapper) adjustTooltipPosition(wrapper);
            }, true);

            document.addEventListener("click", function (evt) {
                var trigger = evt.target.closest ? evt.target.closest(".tooltip-trigger") : null;
                document.querySelectorAll(".tooltip-wrapper.is-open").forEach(function (w) {
                    if (!trigger || !w.contains(trigger)) {
                        w.classList.remove("is-open");
                    }
                });
                if (trigger) {
                    evt.preventDefault();
                    evt.stopPropagation();
                    var wrapper = trigger.closest(".tooltip-wrapper");
                    if (wrapper) {
                        adjustTooltipPosition(wrapper);
                        wrapper.classList.toggle("is-open");
                    }
                }
            });

            /* Manejo HTMX */
            document.body.addEventListener("htmx:beforeSwap", function (evt) {
                if (evt.detail.xhr && evt.detail.xhr.status === 400) {
                    evt.detail.shouldSwap = true;
                    evt.detail.isError = false;
                }
            });

            document.body.addEventListener("htmx:afterSwap", function (evt) {
                var target = evt.detail && evt.detail.target;
                if (!target) return;

                if (target.id === "workspace") {
                    window.closeUploadModal();
                    if (modalForm) modalForm.reset();
                    resetUploadVisual("modal");
                    bindInitialDropzone();
                }

                if (target.id === "resultados-analisis") {
                    window.collapseAuditAccordions();
                    target.scrollIntoView({ behavior: "smooth", block: "start" });
                }

                window.runTypewriter(target);
                window.updatePlotlyTheme(target);
            });

            document.body.addEventListener("htmx:afterSettle", function (evt) {
                var elt = evt.detail && evt.detail.elt;
                if (elt) window.updatePlotlyTheme(elt);
            });

            bindInitialDropzone();
        })();
    </script>
</body>
</html>
